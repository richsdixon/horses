button {

button:disabled {

}

.controls button {

.perc-filter {

}

.range-wrap {
    position: relative;
    width: 260px;
    height: 22px;
}

.range-wrap input[type="range"] {
    position: absolute;
    left: 0;
    top: 0;
    width: 260px;
    margin: 0;
    pointer-events: none;
    accent-color: #444;
}

.range-wrap input[type="range"]::-webkit-slider-thumb {

    cursor: pointer;
}

.range-wrap input[type="range"]::-moz-range-thumb {
    pointer-events: auto;
    cursor: pointer;
}

#percText,

}

.top-rank-filter {

    align-items: center;
    gap: 4px;
    margin-left: 8px;
}

.top-rank-filter input {
    margin: 0;
}

.table-wrap {
    overflow-x: auto;
}

table {
    border-collapse: collapse;
    width: auto;
    font-size: 11px;
    table-layout: fixed;
}

th,
td {
    border: 1px solid #ddd;
    padding: 2px 3px;
    text-align: left;
    line-height: 1.08;
    white-space: nowrap;
}

th {
    background: #f2f2f2;
    position: sticky;
    top: 0;
}

th.sortable {
    cursor: pointer;
    user-select: none;
}

th.sortable:hover {
    background: #e2e5e9;
}

th.sortable:focus-visible {
    outline: 2px solid #0e86c8;
    outline-offset: -2px;
}

th[aria-sort="ascending"],
th[aria-sort="descending"] {
    background: #d7dce2;
}

.th-content {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 3px;
}

.sort-indicator {
    display: inline-block;
    width: 8px;
    min-width: 8px;
    font-size: 8px;
    text-align: center;
}

tr.race-even {
    background: #ffffff;
}

tr.race-odd {
    background: #f5f8fc;
}

.num {
    text-align: right;
    font-variant-numeric: tabular-nums;
}

.win-count {
    background: #6b7280;

tbody td.col-Odds {

const displayCols = ["Course", "Time", "Class", "Dist", "RaceGroup", "Run", "PlaceChance", "Odds", "Horse", "Form", "Age", "Rnum", "Course_Win", "Distance_Win", "Perc", "DildexRank", "Dildex", "PRB_Horse_placepct", "PRB_Jockey_Trainer_placepct", "H_JT_Rank"];
const numericColumns = new Set(["Time", "Class", "Run", "PlaceChance", "Odds", "Age", "Rnum", "Course_Win", "Distance_Win", "Perc", "DildexRank", "Dildex", "PRB_Horse_placepct", "PRB_Jockey_Trainer_placepct", "H_JT_Rank"]);
const dildexMax = 1.0;

const textCollator = new Intl.Collator(
    undefined,
    { numeric: true, sensitivity: "base" }
);

let sortColumn = null;
let sortDirection = null;

const raceOrder = new Map();

rows.forEach(row => {
    if (!raceOrder.has(row.race_filter)) {
        raceOrder.set(row.race_filter, raceOrder.size);
    }
});

function interpolateColor(c1, c2, t) {
    const r = Math.round(c1[0] + (c2[0] - c1[0]) * t);
    const g = Math.round(c1[1] + (c2[1] - c1[1]) * t);
    const b = Math.round(c1[2] + (c2[2] - c1[2]) * t);

    return `rgb(${r}, ${g}, ${b})`;
}

function jetColor(value) {
    const scaleMin = 0.2;
    const scaleMax = 0.8;

    const anchors = [
        { t: 0.00, c: [0, 0, 140] },
        { t: 0.20, c: [0, 180, 255] },
        { t: 0.40, c: [0, 180, 0] },
        { t: 0.60, c: [255, 235, 0] },
        { t: 0.80, c: [255, 130, 0] },
        { t: 1.00, c: [190, 0, 0] }
    ];

    const clipped = Math.max(scaleMin, Math.min(scaleMax, value));
    const t = (clipped - scaleMin) / (scaleMax - scaleMin);

    for (let i = 0; i < anchors.length - 1; i++) {
        if (t >= anchors[i].t && t <= anchors[i + 1].t) {
            const localT = (
                (t - anchors[i].t)
                / (anchors[i + 1].t - anchors[i].t)
            );

            return interpolateColor(
                anchors[i].c,
                anchors[i + 1].c,
                localT
            );
        }
    }

    return "rgb(" + anchors[anchors.length - 1].c.join(",") + ")";
}

function renderDildex(value) {
    const displayNum = parseFloat(value);

    if (isNaN(displayNum)) {
        return "";
    }

    const num = displayNum / 1000;
    const clipped = Math.max(0, Math.min(dildexMax, num));
    const pct = (clipped / dildexMax) * 100;
    const color = jetColor(num);

    return `
        <div class="dildex-wrap">
            <div class="dildex-bar-bg">
                <div
                    class="dildex-bar"
                    style="width: ${pct}%; background: ${color};"
                ></div>
            </div>
            <div class="dildex-value">
                ${displayNum.toFixed(0)}
            </div>
        </div>
    `;
}

function getPercRange() {
    const minInput = document.getElementById("percMin");
    const maxInput = document.getElementById("percMax");

    let minPerc = parseInt(minInput.value, 10);
    let maxPerc = parseInt(maxInput.value, 10);

    if (minPerc > maxPerc) {
        if (document.activeElement === minInput) {
            maxPerc = minPerc;
        } else {
            minPerc = maxPerc;
        }
    }

    minInput.value = minPerc;
    maxInput.value = maxPerc;

    document.getElementById("percText").textContent =
        `${minPerc} - ${maxPerc}`;

    return [minPerc, maxPerc];
}

function getPcRange() {
    const minInput = document.getElementById("pcMin");
    const maxInput = document.getElementById("pcMax");

    let minPc = parseInt(minInput.value, 10);
    let maxPc = parseInt(maxInput.value, 10);

    if (minPc > maxPc) {
        if (document.activeElement === minInput) {
            maxPc = minPc;
        } else {
            minPc = maxPc;
        }
    }

    minInput.value = minPc;
    maxInput.value = maxPc;

    document.getElementById("pcText").textContent =
        `${minPc} - ${maxPc}`;

    return [minPc, maxPc];
}

function renderSpecialWinCell(td, value) {
    const num = parseFloat(value);

    if (!isNaN(num) && num > 0) {
        td.textContent = (
            Number.isInteger(num)
            ? num.toFixed(0)
            : num.toString()
        );

        td.classList.add("win-count");
    } else {
        td.textContent = "";
    }
}

function isEmptyValue(value) {
    return (
        value === null
        || value === undefined
        || String(value).trim() === ""
    );
}

function compareRows(rowA, rowB) {
    const valueA = rowA[sortColumn];
    const valueB = rowB[sortColumn];
    const emptyA = isEmptyValue(valueA);
    const emptyB = isEmptyValue(valueB);

    if (emptyA && emptyB) {
        return 0;
    }

    if (emptyA) {
        return 1;
    }

    if (emptyB) {
        return -1;
    }

    let comparison = 0;

    if (numericColumns.has(sortColumn)) {
        const numberA = Number(valueA);
        const numberB = Number(valueB);

        if (Number.isFinite(numberA) && Number.isFinite(numberB)) {
            comparison = numberA - numberB;
        } else {
            comparison = textCollator.compare(
                String(valueA),
                String(valueB)
            );
        }
    } else {
        comparison = textCollator.compare(
            String(valueA),
            String(valueB)
        );
    }

    return sortDirection === "ascending"
        ? comparison
        : -comparison;
}

function updateSortHeaders() {
    document.querySelectorAll("th.sortable").forEach(header => {
        const column = header.dataset.column;
        const indicator = header.querySelector(".sort-indicator");
        const isActive = column === sortColumn;

        if (!isActive) {
            header.setAttribute("aria-sort", "none");
            indicator.innerHTML = "";
            return;
        }

        header.setAttribute("aria-sort", sortDirection);

        indicator.innerHTML = (
            sortDirection === "ascending"
            ? "&#9650;"
            : "&#9660;"
        );
    });

    document.getElementById("resetSortButton").disabled = (
        sortColumn === null
    );
}

function sortByColumn(column) {
    if (sortColumn !== column) {
        sortColumn = column;
        sortDirection = "ascending";
    } else if (sortDirection === "ascending") {
        sortDirection = "descending";
    } else {
        sortColumn = null;
        sortDirection = null;
    }

    updateSortHeaders();
    renderTable();
}

function resetSort() {
    sortColumn = null;
    sortDirection = null;
    updateSortHeaders();
    renderTable();
}

function renderTable() {
    const selected = Array.from(
        document.getElementById("raceSelect").selectedOptions
    ).map(option => option.value);

    const selectedRaceGroups = Array.from(
        document.getElementById("raceGroupSelect").selectedOptions
    ).map(option => option.value);

    const [minPerc, maxPerc] = getPercRange();
    const [minPc, maxPc] = getPcRange();

    const topDildexOnly = (
        document.getElementById("topDildexOnly").checked
    );

    const topHJTOnly = (
        document.getElementById("topHJTOnly").checked
    );

    const tbody = document.querySelector("#raceTable tbody");
    tbody.innerHTML = "";

    let filteredRows = rows.filter(row => {
        const raceOk = (
            selected.length === 0
            || selected.includes(row.race_filter)
        );

        const raceGroupOk = (
            selectedRaceGroups.length === 0
            || selectedRaceGroups.includes(row.RaceGroup)
        );

        const perc = parseFloat(row.Perc);

        const percOk = isNaN(perc)
            ? minPerc === 0 && maxPerc === 100
            : perc >= minPerc && perc <= maxPerc;

        const pc = parseFloat(row.PlaceChance);

        const pcOk = isNaN(pc)
            ? minPc === 0 && maxPc === 100
            : pc >= minPc && pc <= maxPc;

        const dildexRank = parseFloat(row.DildexRank);

        const topDildexOk = (
            !topDildexOnly
            || dildexRank === 1
        );

        const hjtRank = parseFloat(row.H_JT_Rank);

        const topHJTOk = (
            !topHJTOnly
            || hjtRank === 1
        );

        return (
            raceOk
            && raceGroupOk
            && percOk
            && pcOk
            && topDildexOk
            && topHJTOk
        );
    });

    if (sortColumn !== null) {
        filteredRows = [...filteredRows].sort(compareRows);
    }

    filteredRows.forEach(row => {
        const tr = document.createElement("tr");
        const raceIndex = raceOrder.get(row.race_filter) ?? 0;

        tr.className = (
            raceIndex % 2 === 0
            ? "race-even"
            : "race-odd"
        );

        displayCols.forEach(col => {
            const td = document.createElement("td");
            td.classList.add(`col-${col}`);

            if (col === "Dildex") {
                td.innerHTML = renderDildex(row[col]);
            } else if (
                col === "Course_Win"
                || col === "Distance_Win"
            ) {
                renderSpecialWinCell(td, row[col]);
            } else {
                td.textContent = row[col];

                if (
                    !isNaN(parseFloat(row[col]))
                    && isFinite(row[col])
                ) {
                    td.classList.add("num");
                }
            }

            tr.appendChild(td);
        });

        tbody.appendChild(tr);
    });
}

function clearFilter() {
    const raceSelect = document.getElementById("raceSelect");
    const raceGroupSelect = document.getElementById("raceGroupSelect");

    Array.from(raceSelect.options).forEach(option => {
        option.selected = false;
    });

    Array.from(raceGroupSelect.options).forEach(option => {
        option.selected = false;
    });

    renderTable();
}

document.querySelectorAll("th.sortable").forEach(header => {
    header.addEventListener("click", () => {
        sortByColumn(header.dataset.column);
    });

    header.addEventListener("keydown", event => {
        if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            sortByColumn(header.dataset.column);
        }
    });
});

document
    .getElementById("resetSortButton")
    .addEventListener("click", resetSort);

document
    .getElementById("raceSelect")
    .addEventListener("change", renderTable);

document
    .getElementById("raceGroupSelect")
    .addEventListener("change", renderTable);

document
    .getElementById("percMin")
    .addEventListener("input", renderTable);

document
    .getElementById("percMax")
    .addEventListener("input", renderTable);

document
    .getElementById("pcMin")
    .addEventListener("input", renderTable);

document
    .getElementById("pcMax")
    .addEventListener("input", renderTable);

document
    .getElementById("topDildexOnly")
    .addEventListener("change", renderTable);

document
    .getElementById("topHJTOnly")
    .addEventListener("change", renderTable);

updateSortHeaders();
renderTable();
</script>
